---
name: CI

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  validate-retired-links:
    name: Validate retired repository links
    if: github.repository == 'devantler-tech/dotnet-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@50a5a7a4e9a7b9731be07277bd37bee61a141b71 # v7.8.4
        with:
          enabled: "true"
      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Prepare an isolated retired-link fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/retired-link-fixture.XXXXXX")
          git archive HEAD | tar -x -C "$fixture"
          printf '\n[Retired-link fixture](https://github.com/devantler-tech/reusable-workflows)\n' >> "$fixture/README.md"
          echo "directory=$fixture" >> "$GITHUB_OUTPUT"
      - name: Reject the seeded retired link
        id: negative
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@50a5a7a4e9a7b9731be07277bd37bee61a141b71 # v7.8.4
        with:
          enabled: "true"
          working-directory: ${{ steps.fixture.outputs.directory }}
      - name: Require the negative control to fail without success output
        if: always()
        env:
          OUTCOME: ${{ steps.negative.outcome }}
          VALIDATED: ${{ steps.negative.outputs.validated }}
        run: |
          test "$OUTCOME" = failure
          test -z "$VALIDATED"
      - name: Checkout the exact validator source for diagnostic verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
          path: .catalogue-fixture
          sparse-checkout: actions/validate-retired-repo-links
          persist-credentials: false
      - name: Require the expected README finding
        shell: bash
        env:
          FIXTURE: ${{ steps.fixture.outputs.directory }}
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go -C .catalogue-fixture/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-link-validator" .
          result=0
          "$RUNNER_TEMP/retired-link-validator" --root "$FIXTURE" > "$RUNNER_TEMP/retired-link-finding.log" 2>&1 || result=$?
          cat "$RUNNER_TEMP/retired-link-finding.log"
          test "$result" -eq 1
          grep -E '^README.md:[0-9]+: link targets retired repository devantler-tech/reusable-workflows$' "$RUNNER_TEMP/retired-link-finding.log"

  required-checks:
    name: CI - Required Checks
    needs: [validate-retired-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Aggregate job checks
        uses: devantler-tech/.github/actions/aggregate-job-checks@50a5a7a4e9a7b9731be07277bd37bee61a141b71 # v7.8.4
        with:
          job-results: ${{ needs.validate-retired-links.result }}
