name: Template .NET validation

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  test:
    name: .NET template tests (${{ matrix.os }})
    permissions:
      contents: read # Checkout only; proposed code receives no package credential.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test .NET solution or project
        uses: devantler-tech/.github/actions/run-dotnet-tests@bd24a3e1bbbf6aba2d7afd58a2fd8a3d67bebe6b # v19.0.3
        with:
          # Both PRs and merge groups execute proposed code. Public scaffold
          # dependencies need no authenticated restore or coverage-upload token.
          # The action sets up the pinned SDK before executing any dotnet command.
          github-token: ""
