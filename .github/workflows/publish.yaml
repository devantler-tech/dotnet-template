name: Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.2.3)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout only; NuGet uses its separately scoped API key.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test the released source
        run: dotnet test --configuration Release
      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY" || { echo '::error::Configure NUGET_API_KEY before publishing'; exit 1; }
          version=$(bash scripts/nuget-release-version.sh "$RELEASE_TAG")
          dotnet tool install --global dotnet-releaser --version 0.24.0
          Version="$version" dotnet-releaser publish --nuget-token "$NUGET_API_KEY" dotnet-releaser.toml
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
